    <title>SOC360</title>
    <script>
      ;(function () {
        var redirect = sessionStorage.getItem('soc360.redirect')
        if (redirect) {
          sessionStorage.removeItem('soc360.redirect')
          try {
            var url = new URL(redirect, window.location.href)
            url.pathname = url.pathname.replace(/\/{2,}/g, '/')
            redirect = url.href
          } catch (e) {}
          window.history.replaceState(null, '', redirect)
        }
      })()
    </script>
