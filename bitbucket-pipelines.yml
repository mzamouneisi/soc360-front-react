image: node:22.12.0

definitions:
  caches:
    npm: ~/.npm

pipelines:
  branches:
    main:
      - step:
          name: Build and deploy to Azure Static Web Apps
          caches:
            - node
            - npm
          script:
            - npm ci
            - npm run lint
            - npm test -- --testTimeout=10000
            - npm run build:swa
            - npx --yes @azure/static-web-apps-cli deploy ./dist-azure --deployment-token "$AZURE_STATIC_WEB_APPS_API_TOKEN" --env production
